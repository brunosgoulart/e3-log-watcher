[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "e3-predictive-monitor"
version = "0.1.0"
description = "Monitoramento preditivo auditável para aplicações Elipse E3 via PI System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
pi-af-sdk = ["pythonnet>=3.0,<4.0"]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

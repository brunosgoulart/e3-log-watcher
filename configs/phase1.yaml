# Phase 1 configuration. Secrets are intentionally absent; use environment variables.
pi_system:
  access_method: "pi_af_sdk"
  # Caminho PI confirmado: \\PIDATAPRO\CSEO.COGCGPRO34.E3Run.TRD.
  # PIDATAPRO é o PI Data Archive; CSEO... é o nome da tag/PIPoint.
  # AF Server permanece opcional porque não é necessário para consultar PIPoints diretamente.
  af_server: "${PI_AF_SERVER}"
  data_archive: "PIDATAPRO"
  # Opcional: caminho do OSIsoft.AFSDK.dll quando ele não estiver no GAC.
  af_sdk_assembly_path: "${PI_AFSDK_PATH}"
  authentication_method: "windows_integrated"
  request_timeout_seconds: 30
  retry_attempts: 3
  retry_delay_seconds: 5
  query_mode: "recorded"
  timezone: "America/Sao_Paulo"

acquisition:
  online_interval_seconds: 60
  historical_batch_hours: 24
  overlap_seconds: 10
  expected_collection_interval_seconds: 60
  delayed_after_seconds: 120
  stale_after_seconds: 300
  switchover_suspect_after_seconds: 180
  stabilization_seconds: 600
  unavailable_after_seconds: 900
  minimum_valid_samples: 3
  maximum_events_per_query: 10000
  reject_questionable_values: false
  reject_bad_values: true
  exclude_substituted_from_analysis: false
  store_raw_values: true

storage:
  sqlite_path: "data/e3_monitor.db"

dashboard:
  refresh_seconds: 30
  history_hours: 24

logging:
  level: "INFO"
  structured: true

server_groups:
  - group_id: "COGCGPRO12"
    pi_prefix: "CSEO.COGCGPRO12"
    physical_servers: ["COGCGPRO1", "COGCGPRO2"]
    redundancy_mode: "hot_standby"
  - group_id: "COGCGPRO34"
    pi_prefix: "CSEO.COGCGPRO34"
    physical_servers: ["COGCGPRO3", "COGCGPRO4"]
    redundancy_mode: "hot_standby"
  - group_id: "COGCGPRO56"
    pi_prefix: "CSEO.COGCGPRO56"
    physical_servers: ["COGCGPRO5", "COGCGPRO6"]
    redundancy_mode: "hot_standby"

# Units are deliberately null until confirmed against the PI metadata.
# E3Server.Status remains unknown because its returned domain has not been provided.
metric_catalog:
  E3Run.AvgScriptTime: {expected_type: "number", category: "script", unit: null, enabled: true}
  E3Run.CPU: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Run.DiscardedEvents: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.Errors: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.ErrorsPerMinute: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.HDL: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Run.Memory: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Run.Occupancy: {expected_type: "number", category: "script", unit: null, enabled: true}
  E3Run.PageFaults: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Run.PendingEvents: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.PVT: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Run.RemoteDiscardedPerMinute: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.RemoteDiscardPercent: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.RemoteHandledPerMinute: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.RemotePending: {expected_type: "number", category: "event", unit: null, enabled: true}
  E3Run.TRD: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Run.UpTimeMinutes: {expected_type: "number", category: "uptime", unit: null, enabled: true}
  E3Server.CPU: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Server.HDL: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Server.PVT: {expected_type: "number", category: "resource", unit: null, enabled: true}
  E3Server.Status: {expected_type: "unknown", category: "status", unit: null, enabled: true}
  FileRead: {expected_type: "text", category: "file", unit: null, enabled: true}
  ioQueue.AvgDelay: {expected_type: "number", category: "io_queue", unit: null, enabled: true}
  ioQueue.Pending: {expected_type: "number", category: "io_queue", unit: null, enabled: true}
  TotalTime: {expected_type: "number", category: "collection", unit: null, enabled: true}

# These rules are conservative technical hypotheses. Confirm counter semantics
# before enabling extra reset-sensitive metrics in a production configuration.
redundancy:
  unavailable_status_values: []
  reset_sensitive_metric_suffixes:
    - "E3Run.DiscardedEvents"
    - "E3Run.Errors"
  minimum_switchover_evidence: 2

quality:
  accepted_quality_values: ["Good"]
  bad_quality_values: ["Bad"]
  minimum_group_quality_ratio: 0.75

# Phase 2: statistical rules only. No supervised or unsupervised ML is used.
analysis:
  baseline_minimum_samples: 30
  robust_z_threshold: 3.5
  minimum_relative_baseline_width: 0.05
  trend_window_samples: 12
  minimum_relative_slope_per_hour: 0.05
  alarm_open_persistence: 3
  alarm_resolve_hysteresis: 2
  composite_rules:
    - rule_id: "script_processing_pressure"
      title: "Possível degradação no processamento de scripts"
      severity: "warning"
      metric_suffixes: ["E3Run.Occupancy", "E3Run.AvgScriptTime", "E3Run.CPU"]
      minimum_confirmations: 2
      risk_weight: 30
    - rule_id: "io_queue_backlog"
      title: "Possível represamento na fila de I/O"
      severity: "warning"
      metric_suffixes: ["ioQueue.Pending", "ioQueue.AvgDelay"]
      minimum_confirmations: 2
      risk_weight: 25
    - rule_id: "memory_pressure"
      title: "Possível pressão de memória"
      severity: "warning"
      metric_suffixes: ["E3Run.Memory", "E3Run.PageFaults", "E3Run.PVT"]
      minimum_confirmations: 2
      risk_weight: 25
    - rule_id: "event_backlog"
      title: "Possível represamento de eventos"
      severity: "warning"
      metric_suffixes: ["E3Run.PendingEvents", "E3Run.RemotePending", "E3Run.DiscardedEvents"]
      minimum_confirmations: 2
      risk_weight: 30

forecasting:
  enabled: true
  minimum_samples: 30
  horizon_hours: 4
  minimum_r_squared: 0.70
  metric_suffixes:
    - "E3Run.Memory"
    - "E3Run.HDL"
    - "E3Run.TRD"
    - "ioQueue.Pending"
    - "ioQueue.AvgDelay"
    - "E3Run.PendingEvents"
    - "E3Run.RemotePending"
  # Keep empty until real units and operational limits are approved.
  static_limits: {}

backtesting:
  warmup_samples: 30
  include_stabilizing: false
  report_timezone: "America/Sao_Paulo"

api:
  allow_unauthenticated_read: true
  admin_api_key_env: "E3_MONITOR_ADMIN_API_KEY"

notifications:
  enabled: false
  minimum_severity: "warning"

phase5:
  deployment_mode: "shadow"
  minimum_valid_ratio: 0.90
  minimum_feature_rows: 200
  contamination: 0.01
  feature_metric_suffixes:
    - "E3Run.CPU"
    - "E3Run.Memory"
    - "E3Run.Occupancy"
    - "E3Run.AvgScriptTime"
    - "ioQueue.Pending"
  # Comparison results are audit-only until a controlled approval is recorded.
  allow_alarm_influence: false

# Closed allow-list. No client may query a tag outside this list.
